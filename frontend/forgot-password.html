<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Reset your Wina Bwangu password" />
    <title>Password recovery | Wina Bwangu</title>
    <link rel="stylesheet" href="./css/modules/login.css?v=12" />
  </head>
  <body class="login-page recovery-page">
    <main class="login-shell">
      <section class="login-visual" aria-label="Wina Bwangu introduction">
        <div class="login-visual-overlay"></div>
        <div class="login-branding">
          <h1>Secure access<br /><span>starts here.</span></h1>
          <p class="login-visual-copy">Recover your account and get back to managing your workspace.</p>
        </div>
      </section>

      <section class="login-panel" aria-labelledby="recovery-title">
        <div class="login-card recovery-card">
          <div class="login-heading login-primary-heading">
            <h2 id="recovery-title">Reset your password</h2>
            <p>Enter your username or email to begin recovery.</p>
          </div>

          <form class="login-form" id="forgot-password-form" novalidate>
            <div class="login-field floating-field">
              <input id="forgot-identifier" name="identifier" type="text" autocomplete="username" placeholder=" " required />
              <label for="forgot-identifier">Username or email</label>
            </div>
            <button class="login-submit" type="submit">Request password reset</button>
          </form>

          <div class="recovery-token-box" id="recovery-token-box" hidden>
            <strong>Reset token</strong>
            <p>For this local assignment, use this one-time token below to set your new password.</p>
            <code id="recovery-token"></code>
          </div>

          <form class="login-form" id="reset-password-form" hidden novalidate>
            <div class="login-field floating-field">
              <input id="reset-token" name="token" type="text" autocomplete="one-time-code" placeholder=" " required />
              <label for="reset-token">Reset token</label>
            </div>
            <div class="login-field floating-field">
              <input id="reset-password" name="password" type="password" minlength="8" placeholder=" " required />
              <label for="reset-password">New password</label>
            </div>
            <div class="login-field floating-field">
              <input id="reset-password-confirm" type="password" minlength="8" placeholder=" " required />
              <label for="reset-password-confirm">Confirm new password</label>
            </div>
            <button class="login-submit" type="submit">Set new password</button>
          </form>

          <p class="login-feedback" id="recovery-feedback" role="status" aria-live="polite" hidden></p>
          <p class="recovery-back-link"><a href="/login">← Back to sign in</a></p>
        </div>
      </section>
    </main>

    <script type="module" src="./js/forgot-password.js?v=1"></script>
  </body>
</html>
